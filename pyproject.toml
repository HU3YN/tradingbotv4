[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "terrarium-trading"
version = "0.1.0"
description = "Reproducible ETF strategy research and four-agent Alpaca paper trading"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=2,<3", "pandas>=2.2,<4", "scipy>=1.14,<2", "httpx>=0.27,<1", "exchange-calendars>=4.9,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pond = "pond.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
